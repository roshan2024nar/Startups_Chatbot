<svg viewBox="0 0 860 970" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="970" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="22" text-anchor="middle" fill="#223" font-size="14" font-weight="700">Indian Unicorn Startups Chatbot — System Architecture</text>

  <!-- ═══════════════════════════════════════
       MAIN PIPELINE  (centred at x=430)
  ═══════════════════════════════════════ -->

  <!-- User Query -->
  <rect x="345" y="34" width="170" height="40" rx="6" fill="#dce8f7" stroke="#8ab0d8" stroke-width="1.5"/>
  <text x="430" y="59" text-anchor="middle" fill="#1a3a5c" font-weight="600">User Query</text>
  <line x1="430" y1="74" x2="430" y2="101" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- sanitize_node -->
  <rect x="335" y="103" width="190" height="46" rx="6" fill="#e8e0f7" stroke="#9b8ac4" stroke-width="1.5"/>
  <text x="430" y="123" text-anchor="middle" fill="#2d1a5c" font-weight="600">sanitize_node</text>
  <text x="430" y="140" text-anchor="middle" fill="#5a4080" font-size="11">clean · block · detect · gibberish</text>
  <line x1="430" y1="149" x2="430" y2="177" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Diamond 1: blocked / off-topic? (centre 430, 205) -->
  <polygon points="430,178 546,205 430,232 314,205" fill="#fffbe8" stroke="#c8a040" stroke-width="1.5"/>
  <text x="430" y="200" text-anchor="middle" fill="#6a4010" font-size="12" font-weight="600">blocked /</text>
  <text x="430" y="216" text-anchor="middle" fill="#6a4010" font-size="12" font-weight="600">off-topic?</text>

  <!-- YES → right to Early Response -->
  <line x1="546" y1="205" x2="618" y2="205" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="580" y="198" text-anchor="middle" fill="#888" font-size="11">YES</text>
  <rect x="620" y="183" width="150" height="44" rx="6" fill="#fde8e8" stroke="#d08080" stroke-width="1.5"/>
  <text x="695" y="203" text-anchor="middle" fill="#6a1a1a" font-weight="600">Early Response</text>
  <text x="695" y="219" text-anchor="middle" fill="#a04040" font-size="11">no API call made</text>

  <!-- NO → down -->
  <line x1="430" y1="232" x2="430" y2="258" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="441" y="248" fill="#888" font-size="11">NO</text>

  <!-- route_node -->
  <rect x="335" y="260" width="190" height="46" rx="6" fill="#e8e0f7" stroke="#9b8ac4" stroke-width="1.5"/>
  <text x="430" y="280" text-anchor="middle" fill="#2d1a5c" font-weight="600">route_node</text>
  <text x="430" y="297" text-anchor="middle" fill="#5a4080" font-size="11">intent · filters · is_followup</text>
  <line x1="430" y1="306" x2="430" y2="334" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Follow-up Detection annotation (left, well clear) -->
  <rect x="30" y="265" width="178" height="36" rx="5" fill="#f5f0ff" stroke="#c0b0e8" stroke-width="1"/>
  <text x="119" y="281" text-anchor="middle" fill="#5a4080" font-size="11" font-weight="600">Follow-up Detection</text>
  <text x="119" y="295" text-anchor="middle" fill="#8070a8" font-size="10">"its"  "they"  "these"  "their"</text>
  <line x1="208" y1="283" x2="335" y2="283" stroke="#b0a0d8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Diamond 2: route type? (centre 430, 362) -->
  <polygon points="430,335 546,362 430,389 314,362" fill="#fffbe8" stroke="#c8a040" stroke-width="1.5"/>
  <text x="430" y="357" text-anchor="middle" fill="#6a4010" font-size="12" font-weight="600">route</text>
  <text x="430" y="373" text-anchor="middle" fill="#6a4010" font-size="12" font-weight="600">type?</text>

  <!-- vague → left to clarify_node -->
  <line x1="314" y1="362" x2="244" y2="362" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="278" y="355" text-anchor="middle" fill="#888" font-size="11">vague</text>
  <rect x="62" y="341" width="180" height="42" rx="6" fill="#e8f5e8" stroke="#80b880" stroke-width="1.5"/>
  <text x="152" y="360" text-anchor="middle" fill="#1a4a1a" font-weight="600">clarify_node</text>
  <text x="152" y="375" text-anchor="middle" fill="#3a7a3a" font-size="11">ask clarification question</text>

  <!-- clarify → respond: goes down the left side, clear of everything -->
  <path d="M 62 362 Q 38 362 38 530 Q 38 660 335 660" stroke="#80b880" stroke-width="1.3" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- other routes label right of diamond -->
  <text x="554" y="350" fill="#888" font-size="11">factual /</text>
  <text x="554" y="365" fill="#888" font-size="11">exploratory /</text>
  <text x="554" y="380" fill="#888" font-size="11">structured</text>

  <!-- down from diamond to retrieve_node -->
  <line x1="430" y1="389" x2="430" y2="416" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- retrieve_node -->
  <rect x="335" y="418" width="190" height="46" rx="6" fill="#e8e0f7" stroke="#9b8ac4" stroke-width="1.5"/>
  <text x="430" y="438" text-anchor="middle" fill="#2d1a5c" font-weight="600">retrieve_node</text>
  <text x="430" y="455" text-anchor="middle" fill="#5a4080" font-size="11">select source · inject context</text>

  <!-- ── Exploratory → ChromaDB Filtered (left) -->
  <line x1="335" y1="441" x2="218" y2="441" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="274" y="433" text-anchor="middle" fill="#888" font-size="10">exploratory</text>

  <!-- ── Structured → LlamaIndex (right) -->
  <line x1="525" y1="441" x2="618" y2="441" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="569" y="433" text-anchor="middle" fill="#888" font-size="10">structured</text>

  <!-- ── Factual → ChromaDB Semantic (down) -->
  <line x1="430" y1="464" x2="430" y2="495" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="443" y="484" fill="#888" font-size="10">factual</text>

  <!-- ═══════════════════════════════════════
       DATA STORES ROW
  ═══════════════════════════════════════ -->

  <!-- ChromaDB Filtered — left cylinder (cx=152) -->
  <ellipse cx="152" cy="518" rx="66" ry="14" fill="#dce8f7" stroke="#8ab0d8" stroke-width="1.5"/>
  <rect x="86" y="518" width="132" height="52" fill="#dce8f7" stroke="#8ab0d8" stroke-width="1.5"/>
  <ellipse cx="152" cy="570" rx="66" ry="14" fill="#c8ddf5" stroke="#8ab0d8" stroke-width="1.5"/>
  <text x="152" y="536" text-anchor="middle" fill="#1a3a5c" font-weight="600">ChromaDB</text>
  <text x="152" y="552" text-anchor="middle" fill="#3a5a8c" font-size="11">Filtered search</text>
  <text x="152" y="567" text-anchor="middle" fill="#3a5a8c" font-size="10">industry + city metadata</text>

  <!-- ChromaDB Semantic — centre cylinder (cx=430) -->
  <ellipse cx="430" cy="510" rx="66" ry="14" fill="#dce8f7" stroke="#8ab0d8" stroke-width="1.5"/>
  <rect x="364" y="510" width="132" height="52" fill="#dce8f7" stroke="#8ab0d8" stroke-width="1.5"/>
  <ellipse cx="430" cy="562" rx="66" ry="14" fill="#c8ddf5" stroke="#8ab0d8" stroke-width="1.5"/>
  <text x="430" y="528" text-anchor="middle" fill="#1a3a5c" font-weight="600">ChromaDB</text>
  <text x="430" y="544" text-anchor="middle" fill="#3a5a8c" font-size="11">Semantic search</text>
  <text x="430" y="559" text-anchor="middle" fill="#3a5a8c" font-size="10">cosine similarity</text>

  <!-- LlamaIndex — right box (x=620) -->
  <rect x="620" y="418" width="168" height="60" rx="6" fill="#e8f5e8" stroke="#80b880" stroke-width="1.5"/>
  <text x="704" y="442" text-anchor="middle" fill="#1a4a1a" font-weight="600">LlamaIndex</text>
  <text x="704" y="458" text-anchor="middle" fill="#3a7a3a" font-size="11">PandasQueryEngine</text>
  <text x="704" y="472" text-anchor="middle" fill="#3a7a3a" font-size="10">NL → pandas → NL</text>

  <!-- ═══════════════════════════════════════
       RETURN ARROWS (context back up to respond_node)
  ═══════════════════════════════════════ -->

  <!-- ChromaDB Filtered → respond (goes right then down to respond) -->
  <path d="M 152 584 Q 152 640 335 660" stroke="#555" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  <text x="192" y="622" fill="#888" font-size="10">context</text>

  <!-- ChromaDB Semantic → respond (straight down) -->
  <line x1="430" y1="576" x2="430" y2="606" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="443" y="594" fill="#888" font-size="10">context</text>

  <!-- LlamaIndex → respond (goes down then left) -->
  <path d="M 704 478 Q 704 640 525 660" stroke="#555" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  <text x="660" y="568" fill="#888" font-size="10">context</text>

  <!-- ═══════════════════════════════════════
       RESPOND + OUTPUT
  ═══════════════════════════════════════ -->

  <!-- respond_node -->
  <rect x="335" y="608" width="190" height="46" rx="6" fill="#e8e0f7" stroke="#9b8ac4" stroke-width="1.5"/>
  <text x="430" y="628" text-anchor="middle" fill="#2d1a5c" font-weight="600">respond_node</text>
  <text x="430" y="645" text-anchor="middle" fill="#5a4080" font-size="11">Groq LLM · generate answer</text>
  <line x1="430" y1="654" x2="430" y2="682" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Bot Response -->
  <rect x="345" y="684" width="170" height="42" rx="6" fill="#dce8f7" stroke="#8ab0d8" stroke-width="1.5"/>
  <text x="430" y="703" text-anchor="middle" fill="#1a3a5c" font-weight="600">Bot Response</text>
  <text x="430" y="719" text-anchor="middle" fill="#3a5a8c" font-size="11">returned to user</text>

  <!-- ═══════════════════════════════════════
       INFRASTRUCTURE  (well below pipeline)
  ═══════════════════════════════════════ -->

  <line x1="30" y1="758" x2="830" y2="758" stroke="#e0e0e0" stroke-width="1"/>
  <text x="430" y="753" text-anchor="middle" fill="#bbb" font-size="11" font-weight="600" letter-spacing="2">INFRASTRUCTURE</text>

  <!-- Vertical connector from Bot Response down to infra divider -->
  <line x1="430" y1="726" x2="430" y2="758" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Horizontal spread to each infra item -->
  <line x1="108" y1="758" x2="430" y2="758" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="290" y1="758" x2="430" y2="758" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="560" y1="758" x2="430" y2="758" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="740" y1="758" x2="430" y2="758" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Drop lines to each cylinder -->
  <line x1="108" y1="758" x2="108" y2="773" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="290" y1="758" x2="290" y2="773" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="560" y1="758" x2="560" y2="773" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="740" y1="758" x2="740" y2="773" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Redis (cx=108) -->
  <ellipse cx="108" cy="787" rx="72" ry="14" fill="#fff0e0" stroke="#d09050" stroke-width="1.5"/>
  <rect x="36" y="787" width="144" height="54" fill="#fff0e0" stroke="#d09050" stroke-width="1.5"/>
  <ellipse cx="108" cy="841" rx="72" ry="14" fill="#ffe8cc" stroke="#d09050" stroke-width="1.5"/>
  <text x="108" y="808" text-anchor="middle" fill="#6a3010" font-weight="600">Redis</text>
  <text x="108" y="824" text-anchor="middle" fill="#8a5030" font-size="11">AsyncRedisSaver</text>
  <text x="108" y="839" text-anchor="middle" fill="#8a5030" font-size="10">session persistence</text>

  <!-- Langfuse (cx=290) -->
  <ellipse cx="290" cy="787" rx="72" ry="14" fill="#fff0e0" stroke="#d09050" stroke-width="1.5"/>
  <rect x="218" y="787" width="144" height="54" fill="#fff0e0" stroke="#d09050" stroke-width="1.5"/>
  <ellipse cx="290" cy="841" rx="72" ry="14" fill="#ffe8cc" stroke="#d09050" stroke-width="1.5"/>
  <text x="290" y="808" text-anchor="middle" fill="#6a3010" font-weight="600">Langfuse</text>
  <text x="290" y="824" text-anchor="middle" fill="#8a5030" font-size="11">Spans + Scores</text>
  <text x="290" y="839" text-anchor="middle" fill="#8a5030" font-size="10">observability traces</text>

  <!-- Logger (cx=560) -->
  <ellipse cx="560" cy="787" rx="72" ry="14" fill="#fff0e0" stroke="#d09050" stroke-width="1.5"/>
  <rect x="488" y="787" width="144" height="54" fill="#fff0e0" stroke="#d09050" stroke-width="1.5"/>
  <ellipse cx="560" cy="841" rx="72" ry="14" fill="#ffe8cc" stroke="#d09050" stroke-width="1.5"/>
  <text x="560" y="808" text-anchor="middle" fill="#6a3010" font-weight="600">Logger</text>
  <text x="560" y="824" text-anchor="middle" fill="#8a5030" font-size="11">chatbot.log</text>
  <text x="560" y="839" text-anchor="middle" fill="#8a5030" font-size="10">structured events</text>

  <!-- Groq API (cx=740) -->
  <ellipse cx="740" cy="787" rx="72" ry="14" fill="#fff0e0" stroke="#d09050" stroke-width="1.5"/>
  <rect x="668" y="787" width="144" height="54" fill="#fff0e0" stroke="#d09050" stroke-width="1.5"/>
  <ellipse cx="740" cy="841" rx="72" ry="14" fill="#ffe8cc" stroke="#d09050" stroke-width="1.5"/>
  <text x="740" y="808" text-anchor="middle" fill="#6a3010" font-weight="600">Groq API</text>
  <text x="740" y="824" text-anchor="middle" fill="#8a5030" font-size="11">llama-3.3-70b</text>
  <text x="740" y="839" text-anchor="middle" fill="#8a5030" font-size="10">LLM inference</text>

  <!-- Infra labels above cylinders -->
  <text x="108" y="770" text-anchor="middle" fill="#ccc" font-size="10">memory</text>
  <text x="290" y="770" text-anchor="middle" fill="#ccc" font-size="10">tracing</text>
  <text x="560" y="770" text-anchor="middle" fill="#ccc" font-size="10">logging</text>
  <text x="740" y="770" text-anchor="middle" fill="#ccc" font-size="10">LLM calls</text>

</svg>
